<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Zero Movement Test</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #101010;
      --panel-soft: #181818;
      --white: #f5f5f5;
      --muted: #b7b7b7;
      --red: #d72638;
      --red-soft: rgba(215, 38, 56, 0.18);
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--black);
      color: var(--white);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .lab-shell {
      width: min(94vw, 760px);
      display: grid;
      gap: 18px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--white);
      font-size: clamp(1.8rem, 7vw, 3rem);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 10px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .test-panel {
      border: 4px solid var(--white);
      background: var(--panel);
      box-shadow: 10px 12px 0 var(--shadow);
      padding: 16px;
    }

    .playfield {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 280px;
      overflow: hidden;
      border: 3px solid var(--white);
      background:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        #080808;
      background-size: 32px 32px;
    }

    .box {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 34px;
      height: 34px;
      border: 3px solid var(--white);
      background: var(--panel-soft);
      box-shadow: 0 0 0 2px #000;
      transform: translate3d(0, 0, 0);
    }

    .box.dashing {
      border-color: var(--red);
      box-shadow: 0 0 18px var(--red-soft), 0 0 0 2px #000;
    }

    .block {
      position: absolute;
      border: 2px solid var(--white);
      background: #111;
    }

    .block.danger {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .block.one {
      left: 34%;
      top: 24%;
      width: 18%;
      height: 12%;
    }

    .block.two {
      left: 58%;
      top: 58%;
      width: 18%;
      height: 12%;
    }

    .goal {
      position: absolute;
      right: 28px;
      bottom: 28px;
      width: 46px;
      height: 46px;
      border: 3px solid var(--red);
      background: repeating-linear-gradient(45deg, transparent 0 6px, var(--red-soft) 6px 12px);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .readout,
    .controls,
    .status {
      border: 2px solid var(--white);
      background: #080808;
      padding: 10px;
      min-height: 64px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 4px;
      color: var(--white);
      font-weight: 900;
    }

    .status .value {
      color: var(--red);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 46px;
      border: 3px solid var(--white);
      background: #0b0b0b;
      color: var(--white);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 5px 0 #000;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--red);
      outline: none;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .test-panel {
        padding: 12px;
      }

      .playfield {
        min-height: 320px;
        aspect-ratio: 4 / 5;
      }

      .hud,
      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="lab-shell">
    <header>
      <h1>Lab Zero Movement Test</h1>
      <p class="subtitle">Move the box. Hit the marker. Keep the prototype boring enough to teach us something.</p>
    </header>

    <section class="test-panel" aria-label="Movement test prototype">
      <div class="playfield" id="playfield" tabindex="0" aria-label="Movement test playfield">
        <div class="block one" aria-hidden="true"></div>
        <div class="block danger two" aria-hidden="true"></div>
        <div class="goal" id="goal" aria-hidden="true"></div>
        <div class="box" id="box" aria-label="Player test box"></div>
      </div>

      <div class="hud" aria-live="polite">
        <div class="readout">
          <span class="label">Position</span>
          <span class="value" id="position-readout">x: 40 y: 40</span>
        </div>
        <div class="controls">
          <span class="label">Controls</span>
          <span class="value">WASD / Arrows / Space Dash</span>
        </div>
        <div class="status">
          <span class="label">Status</span>
          <span class="value" id="status-readout">Testing</span>
        </div>
      </div>

      <div class="button-row">
        <button id="reset-button" type="button">Reset</button>
        <button id="center-button" type="button">Center Box</button>
      </div>
    </section>
  </main>

  <script>
    const playfield = document.getElementById("playfield");
    const box = document.getElementById("box");
    const goal = document.getElementById("goal");
    const positionReadout = document.getElementById("position-readout");
    const statusReadout = document.getElementById("status-readout");
    const resetButton = document.getElementById("reset-button");
    const centerButton = document.getElementById("center-button");

    const keys = new Set();
    const player = {
      x: 40,
      y: 40,
      size: 34,
      speed: 3.2,
      dashSpeed: 7.5,
      dashing: false
    };

    const blocks = [
      { left: 0.34, top: 0.24, width: 0.18, height: 0.12 },
      { left: 0.58, top: 0.58, width: 0.18, height: 0.12 }
    ];

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
        event.preventDefault();
      }
      keys.add(event.key.toLowerCase());
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    resetButton.addEventListener("click", () => {
      player.x = 40;
      player.y = 40;
      statusReadout.textContent = "Testing";
      render();
      playfield.focus();
    });

    centerButton.addEventListener("click", () => {
      const bounds = getBounds();
      player.x = Math.round((bounds.width - player.size) / 2);
      player.y = Math.round((bounds.height - player.size) / 2);
      statusReadout.textContent = "Centered";
      render();
      playfield.focus();
    });

    function tick() {
      const bounds = getBounds();
      const dash = keys.has(" ");
      const speed = dash ? player.dashSpeed : player.speed;
      let dx = 0;
      let dy = 0;

      if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
      if (keys.has("arrowright") || keys.has("d")) dx += 1;
      if (keys.has("arrowup") || keys.has("w")) dy -= 1;
      if (keys.has("arrowdown") || keys.has("s")) dy += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
      }

      player.dashing = dash && (dx !== 0 || dy !== 0);
      move(dx * speed, dy * speed, bounds);
      render();
      requestAnimationFrame(tick);
    }

    function move(dx, dy, bounds) {
      const nextX = clamp(player.x + dx, 0, bounds.width - player.size);
      if (!collides(nextX, player.y, bounds)) {
        player.x = nextX;
      }

      const nextY = clamp(player.y + dy, 0, bounds.height - player.size);
      if (!collides(player.x, nextY, bounds)) {
        player.y = nextY;
      }
    }

    function collides(x, y, bounds) {
      const playerRect = { x, y, width: player.size, height: player.size };
      return blocks.some((block) => overlaps(playerRect, scaledBlock(block, bounds)));
    }

    function scaledBlock(block, bounds) {
      return {
        x: bounds.width * block.left,
        y: bounds.height * block.top,
        width: bounds.width * block.width,
        height: bounds.height * block.height
      };
    }

    function render() {
      const bounds = getBounds();
      box.style.transform = `translate3d(${player.x}px, ${player.y}px, 0)`;
      box.classList.toggle("dashing", player.dashing);
      positionReadout.textContent = `x: ${Math.round(player.x)} y: ${Math.round(player.y)}`;

      if (overlaps({ x: player.x, y: player.y, width: player.size, height: player.size }, goalRect())) {
        statusReadout.textContent = "Marker reached";
      } else if (player.dashing) {
        statusReadout.textContent = "Dash test";
      } else if (bounds.width > 0) {
        statusReadout.textContent = "Testing";
      }
    }

    function goalRect() {
      const goalBounds = goal.getBoundingClientRect();
      const fieldBounds = playfield.getBoundingClientRect();
      return {
        x: goalBounds.left - fieldBounds.left,
        y: goalBounds.top - fieldBounds.top,
        width: goalBounds.width,
        height: goalBounds.height
      };
    }

    function getBounds() {
      return playfield.getBoundingClientRect();
    }

    function overlaps(a, b) {
      return a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    playfield.focus();
    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
