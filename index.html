<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Zero Movement Test</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #101010;
      --white: #f5f5f5;
      --muted: #b7b7b7;
      --red: #d72638;
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--black);
      color: var(--white);
      font-family: "Trebuchet MS", Arial, sans-serif;
      touch-action: manipulation;
    }

    .lab-shell {
      width: min(94vw, 760px);
      display: grid;
      gap: 18px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--white);
      font-size: clamp(1.8rem, 7vw, 3rem);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 10px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .test-panel {
      border: 4px solid var(--white);
      background: var(--panel);
      box-shadow: 10px 12px 0 var(--shadow);
      padding: 16px;
    }

    .playfield {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 300px;
      overflow: hidden;
      border: 3px solid var(--white);
      background:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        #080808;
      background-size: 32px 32px;
      outline: none;
      touch-action: none;
    }

    .box {
      position: absolute;
      left: 0;
      top: 0;
      width: 36px;
      height: 36px;
      border: 3px solid var(--white);
      background: #181818;
      box-shadow: 0 0 0 2px #000;
      transform: translate3d(40px, 40px, 0);
    }

    .box.moving {
      border-color: var(--red);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .readout,
    .controls {
      border: 2px solid var(--white);
      background: #080808;
      padding: 10px;
      min-height: 64px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 4px;
      color: var(--white);
      font-weight: 900;
    }

    .touch-controls,
    .button-row {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .touch-controls {
      grid-template-columns: 1fr auto 1fr;
      justify-items: center;
      align-items: center;
    }

    .dpad {
      grid-column: 2;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 52px);
      gap: 8px;
    }

    .button-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    button {
      min-height: 46px;
      border: 3px solid var(--white);
      background: #0b0b0b;
      color: var(--white);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 5px 0 #000;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--red);
      outline: none;
    }

    button:active,
    button.pressed {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000;
    }

    .touch-button {
      min-width: 58px;
      min-height: 52px;
      padding: 0;
      font-size: 1.1rem;
      line-height: 1;
    }

    .touch-button.up {
      grid-column: 2;
      grid-row: 1;
    }

    .touch-button.left {
      grid-column: 1;
      grid-row: 2;
    }

    .touch-button.right {
      grid-column: 3;
      grid-row: 2;
    }

    .touch-button.down {
      grid-column: 2;
      grid-row: 3;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .lab-shell {
        width: min(96vw, 520px);
      }

      .test-panel {
        padding: 12px;
      }

      .playfield {
        min-height: 340px;
        aspect-ratio: 4 / 5;
      }

      .hud,
      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="lab-shell">
    <header>
      <h1>Lab Zero Movement Test</h1>
      <p class="subtitle">Move the square. Test the feel.</p>
    </header>

    <section class="test-panel" aria-label="Movement test prototype">
      <div class="playfield" id="playfield" tabindex="0" aria-label="Movement test playfield">
        <div class="box" id="box" aria-label="Player square"></div>
      </div>

      <div class="hud" aria-live="polite">
        <div class="readout">
          <span class="label">Position</span>
          <span class="value" id="position-readout">x: 40 y: 40</span>
        </div>
        <div class="controls">
          <span class="label">Controls</span>
          <span class="value">WASD / Arrows / Touch</span>
        </div>
      </div>

      <div class="touch-controls" aria-label="Touch movement controls">
        <div class="dpad">
          <button class="touch-button up" type="button" data-control="up" aria-label="Move up">^</button>
          <button class="touch-button left" type="button" data-control="left" aria-label="Move left">&lt;</button>
          <button class="touch-button right" type="button" data-control="right" aria-label="Move right">&gt;</button>
          <button class="touch-button down" type="button" data-control="down" aria-label="Move down">v</button>
        </div>
      </div>

      <div class="button-row">
        <button id="reset-button" type="button">Reset</button>
        <button id="center-button" type="button">Center Square</button>
      </div>
    </section>
  </main>

  <script>
    const playfield = document.getElementById("playfield");
    const box = document.getElementById("box");
    const positionReadout = document.getElementById("position-readout");
    const resetButton = document.getElementById("reset-button");
    const centerButton = document.getElementById("center-button");

    const keys = new Set();
    const touchControls = new Set();
    const player = {
      x: 40,
      y: 40,
      size: 36,
      speed: 3.4,
      moving: false
    };

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
      }
      keys.add(event.key.toLowerCase());
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    document.querySelectorAll("[data-control]").forEach((button) => {
      const control = button.dataset.control;

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touchControls.add(control);
        button.classList.add("pressed");
        playfield.focus();
      });

      button.addEventListener("pointerup", (event) => {
        event.preventDefault();
        touchControls.delete(control);
        button.classList.remove("pressed");
      });

      button.addEventListener("pointercancel", () => {
        touchControls.delete(control);
        button.classList.remove("pressed");
      });

      button.addEventListener("lostpointercapture", () => {
        touchControls.delete(control);
        button.classList.remove("pressed");
      });
    });

    resetButton.addEventListener("click", () => {
      player.x = 40;
      player.y = 40;
      render();
      playfield.focus();
    });

    centerButton.addEventListener("click", () => {
      const bounds = getBounds();
      player.x = Math.round((bounds.width - player.size) / 2);
      player.y = Math.round((bounds.height - player.size) / 2);
      render();
      playfield.focus();
    });

    function tick() {
      const bounds = getBounds();
      let dx = 0;
      let dy = 0;

      if (keys.has("arrowleft") || keys.has("a") || touchControls.has("left")) dx -= 1;
      if (keys.has("arrowright") || keys.has("d") || touchControls.has("right")) dx += 1;
      if (keys.has("arrowup") || keys.has("w") || touchControls.has("up")) dy -= 1;
      if (keys.has("arrowdown") || keys.has("s") || touchControls.has("down")) dy += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
      }

      player.moving = dx !== 0 || dy !== 0;
      player.x = clamp(player.x + dx * player.speed, 0, bounds.width - player.size);
      player.y = clamp(player.y + dy * player.speed, 0, bounds.height - player.size);
      render();
      requestAnimationFrame(tick);
    }

    function render() {
      box.style.transform = `translate3d(${player.x}px, ${player.y}px, 0)`;
      box.classList.toggle("moving", player.moving);
      positionReadout.textContent = `x: ${Math.round(player.x)} y: ${Math.round(player.y)}`;
    }

    function getBounds() {
      return playfield.getBoundingClientRect();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    playfield.focus();
    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
