<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#03060a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Echoes of Earth — a narrative science-fiction game from Black Candle Labs.">
  <title>Echoes of Earth</title>
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <main id="app" class="app" aria-label="Echoes of Earth">
    <section id="menu-screen" class="screen menu-screen is-active" aria-label="Launch pad main menu">
      <img class="menu-background" src="Menus/Main%20Menu.png" alt="A rocket waiting on its launch pad at sunset">
      <div class="menu-vignette" aria-hidden="true"></div>

      <header class="game-title">
        <span>Black Candle Labs</span>
        <h1>Echoes <em>of</em> Earth</h1>
      </header>

      <div id="menu-panel" class="menu-panel">
        <p class="menu-kicker">Launch Terminal</p>
        <div class="menu-actions">
          <button id="new-game-button" class="menu-button" type="button">New Game</button>
          <button id="load-game-button" class="menu-button" type="button" disabled>Load Game</button>
          <button id="clear-save-button" class="menu-button menu-button-danger" type="button" disabled>Clear Save</button>
        </div>
        <p id="save-status" class="save-status" aria-live="polite">No flight record detected</p>
      </div>

    </section>

    <section id="cinematic-screen" class="screen cinematic-screen" aria-label="Opening sequence" hidden>
      <img id="cinematic-image" class="cinematic-image" alt="" hidden>
      <div id="cinematic-black" class="cinematic-black"></div>
      <div id="countdown" class="countdown" aria-live="polite"></div>
      <div id="title-card" class="title-card" hidden>
        <p id="title-card-kicker"></p>
        <h2 id="title-card-title"></h2>
        <p id="title-card-credit"></p>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen" aria-label="The Echo" hidden>
      <canvas id="game-canvas" aria-label="The interior of the Echo"></canvas>
      <header class="game-hud">
        <div class="location-panel">
          <span>Location</span>
          <strong id="location-readout">The Echo · Airlock Deck</strong>
        </div>
        <div class="game-hud-actions">
          <div class="zoom-controls" role="group" aria-label="Camera zoom">
            <button id="zoom-out-button" type="button" aria-label="Zoom out">−</button>
            <output id="zoom-readout" aria-live="polite">25% view</output>
            <button id="zoom-in-button" type="button" aria-label="Zoom in">+</button>
          </div>
          <button id="return-menu-button" type="button">Menu</button>
        </div>
      </header>
      <p id="movement-hint" class="movement-hint">Tap the deck to move</p>
    </section>

    <aside id="dialogue-box" class="dialogue-box" aria-live="polite" hidden>
      <img id="dialogue-portrait" class="dialogue-portrait" alt="">
      <div class="dialogue-copy">
        <strong id="dialogue-speaker" class="dialogue-speaker"></strong>
        <p id="dialogue-text" class="dialogue-text"></p>
        <div id="dialogue-choices" class="dialogue-choices" hidden></div>
      </div>
      <span id="dialogue-prompt" class="dialogue-prompt" aria-hidden="true">Tap to continue</span>
    </aside>

    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <span>Black Candle Labs</span>
      <strong>Preparing launch systems…</strong>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
